<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif">
  <rect width="900" height="560" fill="#0F172A"/>
  <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">User Flow Principal — FanSphere</text>
  <text x="450" y="44" text-anchor="middle" font-size="10" fill="#64748B">Tâche : Suivre un match · Faire une prédiction · Consulter la ligue privée</text>

  
  <rect x="700" y="55" width="185" height="110" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="792" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#94A3B8">LÉGENDE</text>
  <rect x="714" y="80" width="18" height="18" rx="4" fill="#2563EB"/>
  <text x="738" y="93" font-size="9" fill="#94A3B8">Écran principal</text>
  <rect x="714" y="104" width="18" height="18" rx="9" fill="#15803D"/>
  <text x="738" y="117" font-size="9" fill="#94A3B8">Décision</text>
  <rect x="714" y="128" width="18" height="6" rx="2" fill="#DC2626"/>
  <text x="738" y="137" font-size="9" fill="#94A3B8">Flux d'erreur</text>
  <line x1="714" y1="150" x2="732" y2="150" stroke="#2563EB" stroke-width="2"/>
  <text x="738" y="154" font-size="9" fill="#94A3B8">Flux principal</text>

  
  
  <rect x="30" y="60" width="120" height="44" rx="8" fill="#2563EB"/>
  <text x="90" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">1. Tableau</text>
  <text x="90" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">de bord</text>

  
  <line x1="150" y1="82" x2="180" y2="82" stroke="#2563EB" stroke-width="2"/>
  <defs>
    
    
    
  </defs>

  
  <polygon points="210,60 255,82 210,104 165,82" fill="#1E3A5F" stroke="#2563EB" stroke-width="1.5"/>
  <text x="210" y="87" text-anchor="middle" font-size="8" fill="#93C5FD">Matchs</text>
  <text x="210" y="98" text-anchor="middle" font-size="8" fill="#93C5FD">dispo ?</text>

  
  <line x1="255" y1="82" x2="285" y2="82" stroke="#15803D" stroke-width="2"/>
  <text x="270" y="77" text-anchor="middle" font-size="8" fill="#4ADE80">Oui</text>

  
  <line x1="210" y1="104" x2="210" y2="130" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="160" y="130" width="100" height="28" rx="5" fill="#1E293B" stroke="#D97706" stroke-width="1"/>
  <text x="210" y="148" text-anchor="middle" font-size="8" fill="#FBBF24">Prochains matchs</text>

  
  <rect x="285" y="60" width="110" height="44" rx="8" fill="#2563EB"/>
  <text x="340" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">2. Liste des</text>
  <text x="340" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">matchs</text>

  <line x1="395" y1="82" x2="420" y2="82" stroke="#2563EB" stroke-width="2"/>

  
  <polygon points="450,60 495,82 450,104 405,82" fill="#1E3A5F" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="80" text-anchor="middle" font-size="8" fill="#93C5FD">Match</text>
  <text x="450" y="91" text-anchor="middle" font-size="8" fill="#93C5FD">commencé ?</text>

  
  <line x1="450" y1="104" x2="450" y2="135" stroke="#15803D" stroke-width="2"/>
  <text x="462" y="124" font-size="8" fill="#4ADE80">Non</text>

  
  <line x1="495" y1="82" x2="690" y2="82" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="595" y="76" text-anchor="middle" font-size="8" fill="#FBBF24">Oui → Match Center</text>

  
  <rect x="380" y="135" width="140" height="44" rx="8" fill="#1D4ED8"/>
  <text x="450" y="153" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">3. Fiche du match</text>
  <text x="450" y="168" text-anchor="middle" font-size="9" fill="#BFDBFE">avant-match</text>

  <line x1="450" y1="179" x2="450" y2="210" stroke="#2563EB" stroke-width="2"/>

  
  <polygon points="450,210 500,235 450,260 400,235" fill="#1E3A5F" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="230" text-anchor="middle" font-size="8" fill="#93C5FD">Faire une</text>
  <text x="450" y="242" text-anchor="middle" font-size="8" fill="#93C5FD">prédiction ?</text>

  
  <line x1="500" y1="235" x2="570" y2="235" stroke="#15803D" stroke-width="2"/>
  <text x="535" y="229" text-anchor="middle" font-size="8" fill="#4ADE80">Oui</text>

  
  <line x1="400" y1="235" x2="340" y2="235" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="370" y="229" font-size="8" fill="#64748B">Non</text>
  <rect x="270" y="222" width="70" height="26" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="305" y="239" text-anchor="middle" font-size="8" fill="#64748B">Retour accueil</text>

  
  <rect x="570" y="213" width="120" height="44" rx="8" fill="#1D4ED8"/>
  <text x="630" y="231" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">4. Écran de</text>
  <text x="630" y="246" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">prédiction</text>

  <line x1="630" y1="257" x2="630" y2="285" stroke="#2563EB" stroke-width="2"/>

  
  <polygon points="630,285 680,308 630,331 580,308" fill="#1E3A5F" stroke="#2563EB" stroke-width="1.5"/>
  <text x="630" y="304" text-anchor="middle" font-size="8" fill="#93C5FD">Score</text>
  <text x="630" y="316" text-anchor="middle" font-size="8" fill="#93C5FD">valide ?</text>

  
  <line x1="580" y1="308" x2="530" y2="308" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="440" y="296" width="90" height="24" rx="5" fill="#1E293B" stroke="#DC2626" stroke-width="1"/>
  <text x="485" y="312" text-anchor="middle" font-size="8" fill="#F87171">Erreur: score invalide</text>

  
  <line x1="630" y1="331" x2="630" y2="360" stroke="#15803D" stroke-width="2"/>
  <text x="642" y="350" font-size="8" fill="#4ADE80">Oui</text>

  
  <rect x="565" y="360" width="130" height="44" rx="8" fill="#15803D"/>
  <text x="630" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">5. Confirmation</text>
  <text x="630" y="393" text-anchor="middle" font-size="9" fill="#BBF7D0">prédiction enregistrée</text>

  <line x1="630" y1="404" x2="630" y2="430" stroke="#2563EB" stroke-width="2"/>

  
  <rect x="565" y="430" width="130" height="44" rx="8" fill="#2563EB"/>
  <text x="630" y="448" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">6. Match Center</text>
  <text x="630" y="463" text-anchor="middle" font-size="9" fill="#BFDBFE">Score en direct</text>

  <line x1="630" y1="474" x2="630" y2="500" stroke="#2563EB" stroke-width="2"/>

  
  <rect x="565" y="500" width="130" height="44" rx="8" fill="#1D4ED8"/>
  <text x="630" y="518" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">7. Résultat final</text>
  <text x="630" y="533" text-anchor="middle" font-size="9" fill="#BFDBFE">+ Points gagnés</text>

  
  <line x1="565" y1="522" x2="430" y2="522" stroke="#2563EB" stroke-width="2"/>
  <rect x="280" y="500" width="150" height="44" rx="8" fill="#2563EB"/>
  <text x="355" y="518" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">8. Classement</text>
  <text x="355" y="533" text-anchor="middle" font-size="9" fill="#BFDBFE">ligue privée</text>

  
  <line x1="280" y1="522" x2="160" y2="522" stroke="#2563EB" stroke-width="2"/>
  <rect x="30" y="500" width="130" height="44" rx="8" fill="#1D4ED8"/>
  <text x="95" y="518" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">9. Impact</text>
  <text x="95" y="533" text-anchor="middle" font-size="9" fill="#BFDBFE">tournoi</text>

  
  <line x1="95" y1="500" x2="95" y2="440" stroke="#2563EB" stroke-width="2"/>
  <rect x="30" y="396" width="130" height="44" rx="8" fill="#15803D"/>
  <text x="95" y="414" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">10. Prochains</text>
  <text x="95" y="429" text-anchor="middle" font-size="9" fill="#BBF7D0">matchs</text>

  
  <rect x="30" y="300" width="200" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="130" y="318" text-anchor="middle" font-size="9" font-weight="bold" fill="#94A3B8">RÉSUMÉ DU FLUX</text>
  <text x="40" y="334" font-size="8" fill="#64748B">Dashboard → Matchs → Fiche</text>
  <text x="40" y="348" font-size="8" fill="#64748B">→ Prédiction → Confirmation</text>
  <text x="40" y="362" font-size="8" fill="#64748B">→ Match Center → Résultat</text>
</svg>